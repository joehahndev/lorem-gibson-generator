<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image sanitization styles</title>
<style>
  body { margin: 0; padding: 28px; background: #0b0e14; font: 14px "Segoe UI", Arial, sans-serif; color: #e8ecf5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 700px; }
  figure { margin: 0; background: #131826; border: 1px solid #232b40; border-radius: 10px; padding: 12px; }
  figure img { width: 100%; height: auto; border-radius: 6px; display: block; }
  figcaption { margin-top: 8px; color: #8b93a7; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="grid">
    <figure id="snow"><img src="assets/chart.svg" alt="chart"><figcaption>snow</figcaption></figure>
    <figure id="scanlines"><img src="assets/chart.svg" alt="chart"><figcaption>scanlines</figcaption></figure>
    <figure id="scrambled"><img src="assets/chart.svg" alt="chart"><figcaption>scrambled</figcaption></figure>
    <figure id="phosphor"><img src="assets/chart.svg" alt="chart"><figcaption>phosphor</figcaption></figure>
  </div>
</body>
</html>
